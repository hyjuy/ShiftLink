        confirm_with: "반장(운전 조건 변경), 재가동 지정 승인자와 승인 기록"
    # 5. 판단·조치 권한 (현장 확인 전 합성 가정)
    decision_authority:
      can_do:
        - "관측 사실과 경험상 추정을 구분해 기록하고 추가 계측·점검 후보를 제안한다."
