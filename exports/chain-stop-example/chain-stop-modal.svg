<text x="180" y="559" fill="#61746B" font-size="13">설비 상세 화면에서 정지 원인과 관련 정보를 확인할 수 있습니다.</text>
<rect x="784" y="592" width="100" height="40" rx="8" fill="#167E70"/>
<text x="834" y="618" text-anchor="middle" fill="white" font-size="15" font-weight="600">닫기</text>
