        <title id="d3-title">근거 기반 답변 엔진의 판단</title>
        <desc id="d3-desc">질문과 MES 관측으로 후보 카드를 검색하고 판정 모델이 점수를 매긴 뒤, 남은 카드가 없으면 보류하고, 확신이 높으면 반드시 답하며, 애매하면 답변 모델이 보류 여부를 정하고, 검증을 통과한 답만 PDA에 나간다.</desc>
