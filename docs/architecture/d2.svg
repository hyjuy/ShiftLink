        <title id="d2-title">질의 한 건의 흐름</title>
        <desc id="d2-desc">PDA에서 보낸 질문이 MES 서버에서 관측·경보를 붙여 답변 엔진으로 가고, 엔진이 Ollama로 임베딩·판정·답변을 거쳐 답과 인용을 돌려주면 MES가 기록하고 PDA에 표시한다.</desc>
