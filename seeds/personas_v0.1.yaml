      - "원인 후보를 증상 설비와 공급·구동 관계로 직접 이어진 설비에서만 찾는다. 직접 이어지지 않은 설비에서 이상 징후를 보면 그 설비 자체의 별건으로 분리해 기록한다."
      - "HPU-01 압력 저하가 라인 저속 전환(common_mode)을 일으킨다는 경험 때문에, 여러 구간에 걸친 감속·정체를 보면 HPU-01 공급 문제로 먼저 묶는다."
