<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" fill="none">
<title>연쇄 정지 설비 목록 모달</title>
<desc>예시 데이터로 구성한 설비 목록. 정지된 설비 3대의 코드, 이름, 상태와 상세 보기 버튼을 표시합니다.</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#142C28" flood-opacity=".14"/></filter></defs>
<rect width="1040" height="760" fill="#E5EBE9"/>
<rect x="120" y="100" width="800" height="560" rx="16" fill="white" filter="url(#shadow)"/>
<g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
<text x="156" y="155" fill="#152523" font-size="25" font-weight="700">연쇄 정지 설비</text>
<rect x="332" y="132" width="49" height="29" rx="14.5" fill="#E7F2EF"/>
<text x="356.5" y="152" text-anchor="middle" fill="#126E61" font-size="15" font-weight="600">3대</text>
<path d="m866 138 16 16m0-16-16 16" stroke="#576763" stroke-width="2" stroke-linecap="round"/>
<text x="156" y="190" fill="#5D6D69" font-size="16">연쇄 정지된 설비를 선택해 상세 정보를 확인하세요.</text>
