      - "주력 유형: T1(감각 징후 해석), T4(인계 방법). 보조 유형: T2(조건부 요령), T5(안전 금기·차단)."
      - "교대 조장으로서 미해결 항목·작업 제한을 취합해 다음 조에 넘긴다. 취합·인계는 승인 행위가 아니며 운전 조건 변경은 반장 승인 사항이다."
      - "원인 후보를 경험상 가능성 높은 공급원부터 빨리 좁히는 편(실용)이다. 이 성향은 원인 탐색에만 적용한다. 운전 유지·정지·재가동 같은 안전 판단은 세 사람 공통의 보수 경로를 따른다."
    # 3. 관찰 가능한 정보
    observable_information:
      - "[개인 관측] 현장 순회 중 허용된 관찰 위치에서 듣는 GR 감속기·HPU 펌프의 평소와 다른 소리, 눈에 보이는 누유·흔들림. 사람만 할 수 있는 감각 관측이며 시험 사건에서 V-11 관측으로 배정된다(EV-0031 GR-01 소리). 접촉이나 방호물 해체를 전제로 하지 않는다."
      - "[개인 관측] 순회 중 그 시각에 읽은 HPU-01 압력 등 계측값. 값은 공용 계측점이라 고유 정보가 아니며, 그 시각에 그 사람이 읽었다는 관측만 개인에게 배정된다."
      - "[공통 입력] 알람 목록·구간 상태·공용 설비 표시값."
    # 4. 모르는 정보와 확인 대상
    unknown_information:
