<text x="176" y="311" fill="#182B26" font-size="16" font-weight="600">GR-02<tspan dx="14" font-weight="500">압축 구동 설비</tspan></text>
<text x="176" y="335" fill="#65766F" font-size="13">구동 라인</text>
