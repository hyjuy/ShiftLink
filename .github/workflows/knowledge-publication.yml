name: Knowledge publication harness
on:
  pull_request:
    paths:
      - 'shiftlink/mes/**'
      - 'shiftlink/rag/**'
      - 'shiftlink/rag2/**'
      - 'tests/*publication*'
      - 'tests/test_embedding_contract.py'
      - 'scripts/check_knowledge_publication.py'
      - 'docs/failures/knowledge-publication-integrity.md'
      - '.github/workflows/knowledge-publication.yml'
  workflow_dispatch:
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHIFTLINK_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt numpy coverage playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_knowledge_publication.py
      - run: node --check shiftlink/mes/web/candidate-review.js
      - name: Publication API, vector search and browser regressions
        run: >-
          python -m coverage run --branch
          --include='*/mes/publication.py,*/mes/candidate_review.py,*/rag/embedding.py'
          -m pytest -q tests/test_knowledge_publication.py tests/test_publication_worker.py
          tests/test_publication_s30h.py tests/test_publication_browser.py tests/test_candidate_management.py
          tests/test_embedding_contract.py tests/test_publication_harness.py
      - run: python -m coverage report --fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-publication-browser
          path: artifacts/knowledge-publication-20261021/*.png
