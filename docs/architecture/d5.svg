<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d5-title d5-desc" id="d5-root">
        <title id="d5-title">PDA 사용 흐름</title>
        <desc id="d5-desc">작업자 A가 얼굴 로그인, 설비 선택, 설비 확인, 증상 질의, 조치 기록, 근무일지·인계 작성을 거치면 인계가 다음 조 작업자 B에게 전달되고, B는 로그인 뒤 인계 사항과 설비를 확인한다.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d5-root { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #1e293b; }
      #d5-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d5-root .diagram-container { overflow-x: visible; }
}</style>
