<text x="848" y="450" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500" fill="#475569">인계 받은 설비부터</text>
<text x="64" y="584" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Unity 가상 공장에서 플레이어 2명이 캐릭터로 교대 · 인수인계를 시연한다. 가상 설비 화면은 ② 설비 선택의 촬영 입력이 된다.</text>
