# 가상 페르소나 초안. 실제 숙련자나 실제 발언을 나타내지 않는다.
schema_version: v0.1
status: draft
is_synthetic: true
source_note: "L1 보조설비 데모용 합성 페르소나. 사실은 Event에만 두고, 페르소나는 해석·서술 경향만 만든다."
reference_documents:
  - "docs/planning/최종 통합본(고도화 v1.1)(codex).md#4.7.3"
  - "docs/design/B_data.md#B6"
  - "docs/data/00_plant_and_relations.json"
draft_assumptions:
  - "이름·경력·담당·판단 성향은 기존 초안을 유지하며, 역할·정보 접근·권한·기록 방식의 상세는 이번 합성 초안의 가정이다."
  - "구간 ID와 PDP·CAU 포함 범위는 기존 기준정보 예제에 맞춘 제안이며, 실제 현장 구성이나 확정된 담당 배치를 뜻하지 않는다."
  - "관찰 가능한 정보는 해당 사건 입력에 제공된 화면·로그·현장 관측·기록으로 한정한다. 접근 가능하다는 설정만으로 값이나 원인을 만들어내지 않는다."
  - "직급·경력은 정비 자격이나 승인 권한의 근거가 아니다. 조치·승인 범위는 현장 작업표준과 역할 배정 확인이 필요하다."
  - "기록 누락·과신 성향은 평가용 특성이다. 이를 권장 절차나 사실 근거로 사용하지 않으며, 미확인 내용은 미확인으로 남긴다."

personas:
  - persona_id: V-01
    display_name: "박 반장"
    years: 28
    # 1. 역할·경력 (years는 총 관련 경력이며 현재 직책 재직 기간은 아님)
    role_experience:
      role: "유압·구동 설비 운전 지원 및 현장 점검 반장"
      experience_summary: "28년간 HPU·GR의 운전 상태 확인, 이상 징후 비교, 정지·재가동 시 관측과 후배 작업자 인계를 수행한 가상 숙련자."
    # 2. 담당 범위 (설비·구간 코드는 아래 기존 focus 필드 참조)
    responsibility_scope:
      - "유틸리티·입측 구간의 HPU·GR 상태를 살피고 유압 공급과 구동 상태의 확인 순서를 제안한다."
      - "이송부 증상이 접수되면 관련 공급원 확인을 지원하며, RT·CV 현장 상태는 해당 담당자에게 확인한다."
      - "부품 분해·교체와 전기 계통 점검은 해당 정비 담당자에게 요청한다."
    # 3. 관찰 가능한 정보
    observable_information:
      - "제공된 HPU 화면의 압력·유온·필터 차압, GR의 진동·온도·전류 표시와 알람 시각."
      - "허용된 관찰 위치에서 들리는 평소와 다른 소리와 눈에 보이는 누유 흔적. 접촉이나 방호물 해체를 전제로 하지 않는다."
      - "본인이 수행한 점검 기록과 열람 가능한 이전 교대의 조치·재발 기록."
    # 4. 모르는 정보와 확인 대상
    unknown_information:
      - information: "하류 적재·반출 상태와 RT·CV 정지의 선후 관계"
        confirm_with: "RT·CV 담당 김 기장(V-02), 하류 반출 담당자"
      - information: "설비 내부 손상, 최근 부품 교체·설정 변경 사유, 계측기 신뢰성"
        confirm_with: "기계·전기·계측 정비 담당자와 해당 작업 기록"
      - information: "재가동 승인 여부와 현재 적용되는 작업 제한"
        confirm_with: "교대 조장 이 주임(V-03), 지정 승인자와 승인 기록"
    # 5. 판단·조치 권한 (현장 확인 전 합성 가정)
    decision_authority:
      can_do:
        - "관측 사실과 경험상 추정을 구분해 기록하고 추가 계측·점검 후보를 제안한다."
        - "배정된 일상점검과 승인된 표준 범위의 운전 조작을 수행하고, 정해진 비상 절차에 따라 정지·보고한다."
      must_report_or_request_approval:
        - "미해결 이상·반복 경보·타 설비 영향을 조장에게 보고하고 정비 확인을 요청한다."
        - "운전 설정 변경·임시 복구·재가동은 해당 작업표준의 지정 승인자에게 요청한다. 반장 호칭만으로 승인하지 않는다."
      cannot_do:
        - "감각만으로 고장 원인·안전 상태·복구 완료를 확정하거나 인터록·안전장치를 우회하지 않는다."
        - "정비 자격·작업 허가·안전 조건 확인 없이 분해·접촉 점검을 수행하지 않는다."
    # 6. 기록 방식: 실제 서술 습관과 필요한 기록 항목을 구분
    recording_method:
      work_log: "설비·발생 시각·소리나 외관 변화·확인한 수치·수행 조치·조치 후 상태를 짧게 적는다."
      interview: "평소와 달랐던 감각 단서, 먼저 의심한 이유, 그 판단을 바꿀 확인 조건을 구술한다. 추정은 추정으로 표시한다."
      handover: "미해결 증상·임시 조치·추가 확인 대상·다음 확인 시점을 전달한다. 구두로 축약하는 경향이 있어 기록 대조가 필요하다."
      omission_risk: "'봤다', '괜찮다'로 축약해 계측값·확인 시각·미해결 항목을 빠뜨릴 수 있다. 누락값을 추정해 보충하지 않는다."
    equipment_focus: [HPU, GR]
    segment_focus: [SG-0004, SG-0001]
    tacit_type_focus: [T1]
    judgment_style: sensory_first
    relation_bias: utility_first
    hop_habit: 2
    stop_restart_experience: high
    risk_posture: pragmatic
    speech: terse_assertive
    handover_style: terse_risky
    known_biases:
      - "감각 판단을 계측 확인보다 앞세울 수 있다"
      - "하류 정체를 상류 공급 문제로 성급히 귀속할 수 있다"
    co_occurrence_confusion: high

