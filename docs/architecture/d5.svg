<text x="656" y="178" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500" fill="#475569">근거 카드로 답</text>
<text x="656" y="198" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500" fill="#475569">없으면 답 보류</text>
<rect x="832" y="128" width="160" height="88" rx="6" fill="#ffffff"/>
<rect x="832" y="128" width="160" height="88" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
<text x="848" y="156" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="15" font-weight="600" fill="#1e293b">⑤ 조치 기록</text>
<text x="848" y="178" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500" fill="#475569">조치 입력</text>
<text x="848" y="198" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500" fill="#475569">결과 확인</text>
<rect x="1024" y="128" width="160" height="88" rx="6" fill="#ffffff"/>
<rect x="1024" y="128" width="160" height="88" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1"/>
