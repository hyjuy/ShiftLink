<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d6-title d6-desc" id="d6-root">
        <title id="d6-title">얼굴 로그인</title>
        <desc id="d6-desc">PDA 카메라 프레임에서 YuNet으로 얼굴을 찾고 SFace로 임베딩을 만든 뒤 본인 등록 임베딩과 코사인 0.363 이상인지 비교하고, 5장 중 3장 이상 통과하면 로그인한다. 등록 때는 임베딩만 저장하고 원본 이미지는 저장하지 않는다.</desc>
