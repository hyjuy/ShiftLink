# 가상 페르소나. 실제 숙련자나 실제 발언을 나타내지 않는다.
schema_version: v0.2
status: draft
is_synthetic: true
source_note: "L1 보조설비 데모용 합성 페르소나(V-11~V-13). 사실은 Event에만 두고, 페르소나는 해석·서술 경향만 만든다. 이름은 성+호칭만 쓰는 가칭이며 실존 인물과 무관하다."
reference_documents:
  - "docs/planning/최종 통합본(고도화 v1.1)(codex).md#4.7.3"
  - "docs/planning/최종 통합본(고도화 v1.1)(codex).md#4.12"
  - "docs/design/B_data.md#B6"
  - "docs/data/reference/00_plant_and_relations.json"
draft_assumptions:
  - "V-11~V-13이 V-01~V-03을 대체한다. 예약 ID V-04·V-05는 사용하지 않는다."
  - "필드 구조와 열거값은 v0.1과 B_data.md B6-1 표의 값만 쓴다. 새 필드는 없다. 주담당과 보조 담당은 모두 equipment_focus에, 주력과 보조 유형은 모두 tacit_type_focus에 넣는다(앞쪽이 주). 주·보조 구분은 responsibility_scope 문장으로 적는다. segment_focus는 equipment_focus에 든 설비의 실제 소속 구간(기준정보 equipment.segment_id)과 같다."
  - "역할 골격(교대 조장 겸 유압·구동 운전 선임 / 이송 운전·계측 / 설비 정비)은 사용자 결정이며, 경력 연수·세부 담당·기록 습관은 이번 합성 초안의 가정이다. 실제 현장 조직·배치를 뜻하지 않는다."
  - "승인 역할 체계는 세 가지다. 운전 조건 변경은 반장, 설비 내부 점검·분해·걸림 제거 같은 정비 작업은 정지·에너지 차단·잠금 후 정비 담당, 재가동은 지정 승인자가 승인한다. 이는 설계 문서의 역할 라벨(supervisor / maintenance)과 4.12 역할 정의에 대응한다. 라벨은 작업표준이 지정한 사람에게 붙으며, 페르소나의 직급·호칭·경력으로 자동 부여되지 않는다."
  - "재가동 선행조건은 세 페르소나 공통이다. 정지 원인이 확인되고, 인터록 작동 조건이 해소되고, 지정 승인자가 승인해야 한다. 인터록은 작동 조건이 해소되기 전 해제하지 않으며 누구의 승인으로도 강제 해제·바이패스하지 않는다. 페르소나 사이의 해석 차이는 '무엇을 먼저 확인하는가(탐색 순서·원인 후보)'에만 있고, 이 선행조건에는 차이가 없다."
  - "narrative.py는 event(증상·시각)와 operating_context(알람·계측·공용 설비 상태)를 모든 페르소나에게 똑같이 넣는다. 이 공통 입력은 누구의 고유 정보도 아니다. 사람마다 달라지는 입력은 my_observations(관측 재배정)뿐이며, observable_information의 '개인 관측' 문장은 재배정 표의 관측 종류와 일치시킨다."
  - "risk_posture의 실용·보수 차이는 원인 후보를 좁히는 속도와 결론 보류 정도에만 적용한다. 운전 유지·정지, 차단·잠금, 인터록, 재가동 판단은 세 페르소나 모두 같은 보수 경로를 따른다. v0.1 값이 두 개뿐이라 V-12와 V-13이 같은 값(conservative)을 가진다. 두 사람은 judgment_style·relation_bias·speech·handover_style이 모두 다르다."
  - "편향(known_biases)은 라인 전체 relations에서 일반적으로 성립하는 탐색 순서로 적는다. 특정 사건의 결과나 조치를 전제하지 않는다. 교체 이력·구두 인계·분해 소견도 사건 입력에 없으면 있었다고 전제하지 않고 '조회 필요'로만 쓴다."
  - "기록 누락·과신 성향은 평가용 특성이다. 작업 제한 해제·재가동 가능 여부가 기록에 없으면 '해제되지 않음'으로 간주한다."

personas:
