    # 2. 담당 범위
    responsibility_scope:
      - "주담당 설비: HPU-01, GR-01(입측·중앙 롤러 구동), GR-02(출측 롤러·적재 컨베이어 구동). 순회 점검과 운전 상태 확인을 맡는다."
