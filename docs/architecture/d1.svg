        <title id="d1-title">ShiftLink 현장 배치도</title>
        <desc id="d1-desc">라즈베리파이의 PDA 화면과 설비 인식, Unity PC의 가상 공장이 Tailscale로 Jetson의 MES 서버에 연결되고, Jetson 안에서 Ollama 두 대와 SQLite, 업로더가 돌며 업로더가 Aiven MySQL로 기록을 올린다.</desc>
