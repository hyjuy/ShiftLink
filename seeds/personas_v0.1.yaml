conflict_policy:
  factual_ground_truth: "사건 원장은 하나의 사실만 유지한다. 원문은 원장 관측의 시각·순서를 바꾸지 않는다."
  interpretation_policy: "상충하는 해석·요령은 병합하지 않고 별도 카드와 conflict_group으로 관리한다. 의도한 상충은 무엇을 먼저 확인하는가(V-11 공급원→구동원 / V-12 증상 설비 자체 계측·인터록 경로 / V-13 구동·공급의 받는 쪽 부하·부품)와 기록 습관에 한정한다."
  safety_policy: "안전 관련 상충은 보수적인 쪽만 채택하고 다른 쪽은 rejected_safety로 남긴다. 세 페르소나는 같은 경로를 따른다. 정비 작업은 정지·에너지 차단·잠금 후 정비 담당이 승인하고, 운전 조건 변경은 반장이 승인한다. 인터록은 조건 해소 전 해제하지 않는다. 재가동은 정지 원인 확인·인터록 조건 해소 뒤 지정 승인자가 승인한다. 작업 제한 해제가 기록에 없으면 해제되지 않은 것으로 본다."